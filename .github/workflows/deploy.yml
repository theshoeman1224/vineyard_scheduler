# Deploy to Cloudflare Workers on every push to main. The four repo gates
# run first so a red build never reaches beachroad.casa; deploys are
# serialized by the concurrency group so two merges cannot interleave.
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # v7 of both actions run on the Node 24 action runtime (v4 used the
      # deprecated Node 20). The build's Node version comes from .nvmrc so
      # CI and local dev cannot drift.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Lifecycle scripts are skipped so a compromised dependency cannot
      # execute code at install time; every binary the build needs
      # (esbuild, unrs-resolver, workerd) ships via optionalDependencies,
      # so no postinstall step is required.
      - run: npm ci --ignore-scripts
      - run: npm run test
      # Typecheck needs Next's generated route types (LayoutProps etc.),
      # which normally appear only after dev/build has run once.
      - run: npm run typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
