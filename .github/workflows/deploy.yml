# Deploy to Cloudflare Workers on every push to main. The four repo gates
# run first so a red build never reaches beachroad.casa; deploys are
# serialized by the concurrency group so two merges cannot interleave.
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test
      # Typecheck needs Next's generated route types (LayoutProps etc.),
      # which normally appear only after dev/build has run once.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
